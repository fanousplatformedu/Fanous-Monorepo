# ================ Assessment Reports ===============
query AssessmentResults($input: ListAssessmentResultsInput!) {
  assessmentResults(input: $input) {
    take
    skip
    total
    items {
      id
      musical
      schoolId
      studentId
      createdAt
      linguistic
      logicalMath
      summaryJson
      dominantKey
      naturalistic
      visualSpatial
      interpersonal
      intrapersonal
      bodilyKinesthetic
      studentAssignmentId
      student {
        id
        email
        firstName
        lastName
      }
      studentAssignment {
        id
        status
        startedAt
        studentId
        submittedAt
        evaluatedAt
        assignmentId
        completionRate
        assignment {
          id
          title
        }
      }
    }
  }
}

